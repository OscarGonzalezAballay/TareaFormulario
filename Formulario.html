<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-dark text-white">

<div class="container mt-5">
<!-- Titulo de la pagina -->
<div>
  <h1 class="text-center mb-4">Lista de Tareas</h1>
</div>
<!-- Formulario para agregar tareas -->
<div>
  <form id="task-form" class="d-flex mb-4">
    <input type="text" id="task-input" class="form-control me-2" placeholder="Escribe una tarea">
    <button type="submit" class="btn btn-primary">Agregar</button>
  </form>
</div>
<!-- Lista de tareas -->
<div>
  <ul id="task-list" class="list-group mb-3"></ul>
</div>
<!-- Mensaje de lista de tareas vacia -->
  <div id="empty-message" class="alert alert-info text-center" style="display: none;">
    ¡La lista está vacía!
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="./Script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
